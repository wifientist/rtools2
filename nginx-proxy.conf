server {
    listen 80;
    server_name localhost;

    # Hide nginx version
    server_tokens off;

    # Allow large uploads (Cloudpath JSON exports can exceed default 1MB)
    client_max_body_size 20m;

    # The real client, not the proxy in front of us.
    #
    # Traffic reaches this nginx from an upstream proxy at 100.74.178.158
    # (Tailscale / CGNAT range), which puts the actual client in
    # X-Forwarded-For. Without this, $remote_addr -- and so the X-Real-IP the
    # backend rate-limits and audit-logs by -- was that proxy for EVERY user.
    #
    # Trust exactly that hop, not the whole 100.64.0.0/10 range: any other
    # tailnet device could then connect here and choose its own IP.
    # If the upstream proxy moves, update this address; the failure mode of
    # a stale entry is only the old shared-bucket behaviour, never spoofing.
    set_real_ip_from 100.74.178.158;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.s3.amazonaws.com https://*.s3.*.amazonaws.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Main React frontend (production build served by nginx)
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI Backend
    location /api {
        proxy_pass http://backend:4174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running operations (audits, migrations, etc.)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

}
